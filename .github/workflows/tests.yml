# L'usine tourne sur un telephone, sans dependance et sans reseau. Cette
# integration continue verifie exactement cela : la suite et le test de
# fumee passent sur une installation Python nue, sur plusieurs versions,
# sans jamais installer quoi que ce soit.
name: tests

on:
  push:
    # « main » seul. Chaque poussee alimentait DEUX executions identiques :
    # la branche miroir de session porte toujours le meme commit que main,
    # et les cinq jobs tournaient deux fois pour la meme information. Sur un
    # depot prive, les minutes Actions sont comptees — le 26/09/2026, le
    # plafond du mois est tombe en fin de journee, et toute la CI avec.
    branches: ["main"]
  pull_request:
  # Relancer a la main, sans commit. Le 26/09/2026, les cinq jobs d'une
  # poussee sont morts en deux secondes, sans etape ni journal — les
  # coureurs n'ont jamais demarre. Sans ce declencheur, la seule relance
  # possible etait un commit vide, que ce depot s'interdit.
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    # La suite tient en trois minutes ; sans borne, un fil qui ne meurt pas
    # (c'est arrive : un travail du tableau de bord survivait a son module)
    # tiendrait le coureur six heures, le defaut GitHub (verifie le
    # 26/09/2026), et la CI semblerait juste lente.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Termux livre la version courante ; les anciennes restent en place
        # longtemps sur un telephone qu'on ne met pas a jour. 3.14 est celle
        # du telephone (SPECS-APPAREIL.md, releve du 14/09/2026 : 3.14.6) :
        # elle manquait, et c'etait la seule qui compte vraiment.
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Aucune dependance ne doit etre necessaire
        run: |
          python -c "import sys; print(sys.version)"
          pip list --format=freeze > /tmp/avant.txt
          cat /tmp/avant.txt

      - name: Suite de tests
        run: python -m unittest discover -s tests -t . -v

      - name: Test de fumee — les chaines via la vraie CLI
        run: python tests/fumee.py

      - name: Le module doit se lancer tel quel
        run: python -m usine --version

  hygiene:
    runs-on: ubuntu-latest
    # La suite tient en trois minutes ; sans borne, un fil qui ne meurt pas
    # (c'est arrive : un travail du tableau de bord survivait a son module)
    # tiendrait le coureur six heures, le defaut GitHub (verifie le
    # 26/09/2026), et la CI semblerait juste lente.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Les motifs sont ceux qui masquent les cles dans le journal : un prefixe
      # seul (« gsk_ ») signalait la documentation et les cles factices des
      # tests, et ce job fut rouge du 12 au 23/09/2026 sans une seule vraie cle.
      - name: Aucun secret dans le depot
        run: python scripts/fuites.py

      - name: Tout le code doit se compiler
        run: python -m compileall -q usine tests

      - name: Aucun import hors bibliotheque standard
        run: python scripts/dependances.py
